<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create short links and inspect click analytics.">
  <title>TraceLink — URL Shortener</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #e7e9ee; background: #0b0d10; }
    main { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 72px 0; }
    header { margin-bottom: 42px; }
    .eyebrow { color: #71e6b4; font: 700 12px/1 monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 14px 0 12px; font-size: clamp(36px, 8vw, 62px); letter-spacing: -.055em; line-height: .98; }
    header p { max-width: 540px; color: #9299a5; font-size: 17px; line-height: 1.6; }
    .panel { padding: 24px; border: 1px solid #24282f; border-radius: 18px; background: #12151a; box-shadow: 0 20px 60px #0005; }
    .panel + .panel { margin-top: 16px; }
    h2 { margin: 0 0 18px; font-size: 15px; }
    form { display: grid; gap: 12px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    label { color: #aeb4be; font-size: 13px; }
    input { width: 100%; margin-top: 7px; padding: 13px 14px; color: inherit; border: 1px solid #30353d; border-radius: 10px; outline: none; background: #0b0d10; font: inherit; }
    input:focus { border-color: #71e6b4; box-shadow: 0 0 0 3px #71e6b420; }
    button { align-self: end; padding: 13px 18px; border: 0; border-radius: 10px; color: #07120d; background: #71e6b4; font: 700 14px/1 inherit; cursor: pointer; }
    button:hover { background: #91f0c9; }
    button:disabled { cursor: wait; opacity: .6; }
    .optional { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .result { display: none; margin-top: 18px; padding: 16px; border-radius: 12px; background: #0b0d10; }
    .result.visible { display: block; }
    .result-line { display: flex; align-items: center; gap: 10px; }
    .result a { min-width: 0; overflow: hidden; color: #71e6b4; text-overflow: ellipsis; white-space: nowrap; }
    .copy { margin-left: auto; padding: 9px 11px; color: #e7e9ee; border: 1px solid #30353d; background: transparent; }
    .message { min-height: 20px; margin: 12px 0 0; color: #ff8d8d; font-size: 13px; }
    dl { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 0; }
    dl.visible { display: grid; }
    dl div { padding: 14px; border-radius: 10px; background: #0b0d10; }
    dt { color: #7f8793; font-size: 11px; text-transform: uppercase; }
    dd { margin: 7px 0 0; font-size: 18px; font-weight: 700; }
    footer { margin-top: 24px; color: #686f7a; font-size: 12px; text-align: center; }
    footer a { color: #9299a5; }
    @media (max-width: 560px) { main { padding: 42px 0; } .row, .optional { grid-template-columns: 1fr; } .row button { width: 100%; } dl { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">TraceLink</div>
      <h1>Short links.<br>Clear signals.</h1>
      <p>Turn long URLs into clean, shareable links and see how often they are opened.</p>
    </header>
    <section class="panel">
      <h2>Create a short link</h2>
      <form id="create-form">
        <label>Destination URL
          <input id="url" type="url" placeholder="https://example.com/your-long-url" required>
        </label>
        <div class="optional">
          <label>Custom slug (optional)
            <input id="slug" pattern="[A-Za-z0-9_-]{3,32}" placeholder="my-link">
          </label>
          <label>Expiration (optional)
            <input id="expires" type="datetime-local">
          </label>
        </div>
        <button id="create-button" type="submit">Shorten URL</button>
      </form>
      <div id="create-result" class="result" aria-live="polite">
        <div class="result-line">
          <a id="short-url" target="_blank" rel="noopener"></a>
          <button id="copy-button" class="copy" type="button">Copy</button>
        </div>
      </div>
      <p id="create-message" class="message" role="alert"></p>
    </section>
    <section class="panel">
      <h2>Check analytics</h2>
      <form id="stats-form" class="row">
        <label>Short link slug
          <input id="stats-slug" placeholder="my-link" required>
        </label>
        <button id="stats-button" type="submit">View stats</button>
      </form>
      <dl id="stats-result" aria-live="polite">
        <div><dt>Total clicks</dt><dd id="total-clicks">0</dd></div>
        <div><dt>First click</dt><dd id="first-click">—</dd></div>
        <div><dt>Last click</dt><dd id="last-click">—</dd></div>
      </dl>
      <p id="stats-message" class="message" role="alert"></p>
    </section>
    <footer>Built with FastAPI · <a href="/docs">Open API documentation</a></footer>
  </main>
  <script>
    const byId = (id) => document.getElementById(id);
    const errorText = async (response) => {
      try { const body = await response.json(); return body.detail || "Request failed."; }
      catch { return "Request failed. Please try again."; }
    };
    const formatDate = (value) => value ? new Date(value).toLocaleString() : "—";

    byId("create-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = byId("create-button");
      button.disabled = true;
      byId("create-message").textContent = "";
      byId("create-result").classList.remove("visible");
      const payload = { original_url: byId("url").value };
      if (byId("slug").value) payload.custom_slug = byId("slug").value;
      if (byId("expires").value) payload.expires_at = new Date(byId("expires").value).toISOString();
      try {
        const response = await fetch("/api/v1/links", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        if (!response.ok) throw new Error(await errorText(response));
        const link = await response.json();
        byId("short-url").href = link.short_url;
        byId("short-url").textContent = link.short_url;
        byId("stats-slug").value = link.slug;
        byId("create-result").classList.add("visible");
      } catch (error) { byId("create-message").textContent = error.message; }
      finally { button.disabled = false; }
    });

    byId("copy-button").addEventListener("click", async () => {
      await navigator.clipboard.writeText(byId("short-url").href);
      byId("copy-button").textContent = "Copied";
      setTimeout(() => { byId("copy-button").textContent = "Copy"; }, 1400);
    });

    byId("stats-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = byId("stats-button");
      button.disabled = true;
      byId("stats-message").textContent = "";
      byId("stats-result").classList.remove("visible");
      try {
        const slug = encodeURIComponent(byId("stats-slug").value.trim());
        const response = await fetch(`/api/v1/links/${slug}/stats`);
        if (!response.ok) throw new Error(await errorText(response));
        const stats = await response.json();
        byId("total-clicks").textContent = stats.total_clicks;
        byId("first-click").textContent = formatDate(stats.first_clicked_at);
        byId("last-click").textContent = formatDate(stats.last_clicked_at);
        byId("stats-result").classList.add("visible");
      } catch (error) { byId("stats-message").textContent = error.message; }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
